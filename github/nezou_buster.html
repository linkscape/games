<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>寝相バスター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
  :root { --ink:#fff; --accent:#ffd84a; --danger:#ff5a6a; --ok:#6cf0a0; --panel:rgba(14,18,40,.72); }
  html,body { margin:0; height:100%; overflow:hidden; background:#1b2140; font-family:"M PLUS Rounded 1c",system-ui,sans-serif; color:var(--ink); }
  canvas { display:block; }
  #hud { position:fixed; top:12px; left:12px; padding:10px 14px; background:var(--panel); border-radius:12px; font-size:15px; line-height:1.6; pointer-events:none; min-width:170px; }
  #hud b { color:var(--accent); font-size:20px; }
  #help { position:fixed; top:12px; right:12px; padding:10px 14px; background:var(--panel); border-radius:12px; font-size:13px; line-height:1.7; pointer-events:none; }
  #sel { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); padding:10px 22px; background:var(--panel); border-radius:999px; font-size:17px; font-weight:800; pointer-events:none; white-space:nowrap; transition:transform .1s; }
  #sel.shake { animation:shake .3s; }
  @keyframes shake { 0%,100%{transform:translateX(-50%)} 25%{transform:translateX(calc(-50% - 8px))} 75%{transform:translateX(calc(-50% + 8px))} }
  #overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(10,12,30,.55); }
  #overlay .card { background:rgba(20,24,56,.92); border:2px solid rgba(255,255,255,.15); border-radius:20px; padding:28px 34px; max-width:520px; margin:16px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.4); }
  #overlay h1 { margin:0 0 6px; font-size:44px; font-weight:800; color:var(--accent); letter-spacing:.05em; text-shadow:0 4px 0 #b0581e; }
  #overlay p { margin:8px 0; line-height:1.7; font-size:15px; }
  #overlay .big { font-size:22px; font-weight:800; }
  #overlay .blink { margin-top:18px; font-size:18px; font-weight:800; color:var(--accent); animation:blink 1.1s infinite; }
  @keyframes blink { 50% { opacity:.3; } }
  kbd { display:inline-block; padding:1px 7px; border-radius:6px; background:#fff; color:#222; font-family:inherit; font-size:.9em; font-weight:800; box-shadow:0 2px 0 #999; }
  .pop { position:fixed; left:0; top:0; font-weight:800; font-size:20px; pointer-events:none; text-shadow:0 2px 0 #000, 0 0 8px rgba(0,0,0,.6); white-space:nowrap; }
  #warn { position:fixed; top:22%; left:50%; transform:translateX(-50%); font-size:28px; font-weight:800; color:var(--danger); text-shadow:0 3px 0 #000; pointer-events:none; opacity:0; }
  @media (max-width:640px){ #help{display:none;} #overlay h1{font-size:34px;} }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="hud">スコア <b id="score">0</b><br>時間 <span id="time">0.0</span>秒<br>破壊 <span id="kills">0</span>個</div>
<div id="help"><kbd>←↑↓→</kbd> ベッドを動かす<br><kbd>Enter</kbd> 動かすベッドを切替<br><kbd>Space</kbd> 反対側へワープ<br>寝てる方のベッドは動かせない<br>ぶつければ何でも壊せる</div>
<div id="sel"></div>
<div id="warn">あぶない！</div>
<div id="overlay"><div class="card" id="card"></div></div>

<script type="module">
import * as THREE from 'three';

// ---------- 基本セットアップ ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x232a52);
scene.fog = new THREE.Fog(0x232a52, 38, 95);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 300);
camera.position.set(0, 10, 9);

scene.add(new THREE.HemisphereLight(0xc8d8ff, 0x4a3a2a, 0.95));
const sun = new THREE.DirectionalLight(0xfff0dd, 1.35);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -22, right: 22, top: 22, bottom: -22, near: 1, far: 80 });
sun.shadow.bias = -0.0008;
scene.add(sun, sun.target);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------- ユーティリティ ----------
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const boxGeo = new THREE.BoxGeometry(1, 1, 1);
const cylGeo = new THREE.CylinderGeometry(0.5, 0.5, 1, 14);
const sphGeo = new THREE.SphereGeometry(0.5, 14, 10);
const cone4 = new THREE.ConeGeometry(0.5, 1, 4);
const cone8 = new THREE.ConeGeometry(0.5, 1, 9);
const matCache = new Map();
function mat(c, emissive = 0) {
  const k = c + '_' + emissive;
  if (!matCache.has(k)) matCache.set(k, new THREE.MeshLambertMaterial({ color: c, emissive }));
  return matCache.get(k);
}
function mk(geo, material, sx, sy, sz, x, y, z, parent) {
  const m = new THREE.Mesh(geo, typeof material === 'number' ? mat(material) : material);
  m.scale.set(sx, sy, sz); m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  if (parent) parent.add(m);
  return m;
}
const box = (w, h, d, c, x, y, z, p) => mk(boxGeo, c, w, h, d, x, y, z, p);

// ---------- サウンド ----------
let actx = null, lastCrash = 0;
function audio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  return actx;
}
function noise(len, freq, vol) {
  const a = audio(); if (!a) return;
  const buf = a.createBuffer(1, Math.floor(a.sampleRate * len), a.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2.2);
  const src = a.createBufferSource(); src.buffer = buf;
  const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq;
  const g = a.createGain(); g.gain.value = vol;
  src.connect(f).connect(g).connect(a.destination); src.start();
}
function tone(f0, f1, len, vol, type = 'sine') {
  const a = audio(); if (!a) return;
  const o = a.createOscillator(); o.type = type;
  const g = a.createGain(); const t = a.currentTime;
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + len);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + len);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + len);
}
function sfxCrash(s) {
  const now = performance.now(); if (now - lastCrash < 45) return; lastCrash = now;
  noise(0.25 + s * 0.5, 500 + s * 1500, 0.25 + s * 0.25);
  tone(140, 40, 0.25 + s * 0.2, 0.25, 'triangle');
}
const sfxBoing = () => tone(420, 140, 0.22, 0.12, 'sine');
const sfxHop = () => tone(260, 700, 0.18, 0.1, 'square');
const sfxThud = () => { noise(0.5, 300, 0.5); tone(90, 30, 0.5, 0.5, 'sine'); };
const sfxTransfer = () => { tone(600, 900, 0.12, 0.1, 'triangle'); };

// ---------- 静的な地面・道路 ----------
const ground = new THREE.Mesh(new THREE.PlaneGeometry(220, 220), mat(0x5d8a4a));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const roadMat = mat(0x3a3d45), lineMat = mat(0xd8d2b0);
const ROADS = [-42, -26, -10, 10, 26, 42];
for (const c of ROADS) {
  const a = new THREE.Mesh(new THREE.PlaneGeometry(4, 100), roadMat); a.rotation.x = -Math.PI / 2; a.position.set(c, 0.01, 0); a.receiveShadow = true; scene.add(a);
  const b = new THREE.Mesh(new THREE.PlaneGeometry(100, 4), roadMat); b.rotation.x = -Math.PI / 2; b.position.set(0, 0.012, c); b.receiveShadow = true; scene.add(b);
  for (let t = -48; t < 48; t += 4) {
    const l1 = new THREE.Mesh(new THREE.PlaneGeometry(0.15, 1.6), lineMat); l1.rotation.x = -Math.PI / 2; l1.position.set(c, 0.015, t); scene.add(l1);
    const l2 = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 0.15), lineMat); l2.rotation.x = -Math.PI / 2; l2.position.set(t, 0.016, c); scene.add(l2);
  }
}
// 部屋の床とラグ
const ROOM = 8;
const floorM = new THREE.Mesh(new THREE.PlaneGeometry(ROOM * 2, ROOM * 2), mat(0xb98a5e));
floorM.rotation.x = -Math.PI / 2; floorM.position.y = 0.02; floorM.receiveShadow = true; scene.add(floorM);
const rug = new THREE.Mesh(new THREE.PlaneGeometry(7, 5.5), mat(0x7d5ba6));
rug.rotation.x = -Math.PI / 2; rug.position.set(0.8, 0.03, 0.3); rug.receiveShadow = true; scene.add(rug);

// ---------- ビル用テクスチャ ----------
function canvasTex(draw, size = 64) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const winTex = canvasTex((g, s) => {
  g.fillStyle = '#fff'; g.fillRect(0, 0, s, s);
  g.fillStyle = '#4a5068';
  for (const x of [8, 38]) for (const y of [8, 38]) g.fillRect(x, y, 18, 20);
});
const litTexs = [0, 1, 2].map(() => canvasTex((g, s) => {
  g.fillStyle = '#000'; g.fillRect(0, 0, s, s);
  for (const x of [8, 38]) for (const y of [8, 38]) if (Math.random() < 0.5) { g.fillStyle = '#ffd890'; g.fillRect(x, y, 18, 20); }
}));
const bldMats = [0xd8d0c0, 0xa8b4c8, 0xc8a890, 0x9aa49a, 0xe0c8c8, 0xb0a8c8].map(c => new THREE.MeshLambertMaterial({
  color: c, map: winTex, emissive: 0xffffff, emissiveMap: pick(litTexs), emissiveIntensity: 0.55
}));
const roofMat = mat(0x6a6a72);
function bldGeo(w, h, d, tile = 3.2) {
  const g = new THREE.BoxGeometry(w, h, d); const uv = g.attributes.uv;
  const dims = [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]];
  for (let f = 0; f < 6; f++) for (let i = 0; i < 4; i++) {
    const k = f * 4 + i; uv.setXY(k, uv.getX(k) * dims[f][0] / tile, uv.getY(k) * dims[f][1] / tile);
  }
  return g;
}

// ---------- 壊せるもの ----------
const destructibles = [];
function addD(group, x, z, ry, points, name) {
  group.position.set(x, 0, z); group.rotation.y = ry || 0;
  scene.add(group); group.updateMatrixWorld(true);
  const b = new THREE.Box3().setFromObject(group);
  const colors = [];
  group.traverse(o => { if (o.isMesh) { const m = Array.isArray(o.material) ? o.material[0] : o.material; colors.push(m.color.getHex()); } });
  destructibles.push({ group, box: b, colors, points, name, alive: true });
}

// 家具
function wardrobe() { const g = new THREE.Group(); box(1.6, 2.2, 0.7, 0x8a5a3b, 0, 1.1, 0, g); box(0.04, 2.0, 0.72, 0x5e3b24, 0, 1.1, 0, g); box(0.06, 0.25, 0.75, 0xd8c070, -0.15, 1.2, 0, g); box(0.06, 0.25, 0.75, 0xd8c070, 0.15, 1.2, 0, g); return g; }
function bookshelf() {
  const g = new THREE.Group(); box(1.8, 1.8, 0.4, 0x9b6b43, 0, 0.9, 0, g);
  for (const y of [0.35, 0.9, 1.45]) { let x = -0.78; while (x < 0.7) { const w = rand(0.08, 0.16); box(w, rand(0.3, 0.42), 0.32, pick([0xd04a4a, 0x3a7bd5, 0xe8c040, 0x4ab070, 0xf0f0f0, 0x8a4ac0]), x + w / 2, y, 0.06, g); x += w + 0.01; } }
  return g;
}
function desk() { const g = new THREE.Group(); box(1.6, 0.08, 0.8, 0xc8a070, 0, 0.75, 0, g); for (const [x, z] of [[-0.72, -0.32], [0.72, -0.32], [-0.72, 0.32], [0.72, 0.32]]) box(0.07, 0.75, 0.07, 0x555555, x, 0.37, z, g); box(0.8, 0.5, 0.05, 0x222222, 0, 1.1, -0.2, g); box(0.72, 0.42, 0.02, mat(0x223344, 0x2a5a9a), 0, 1.1, -0.17, g); box(0.5, 0.03, 0.18, 0x333333, 0, 0.8, 0.12, g); return g; }
function chair() { const g = new THREE.Group(); box(0.55, 0.08, 0.55, 0x334455, 0, 0.5, 0, g); box(0.55, 0.6, 0.08, 0x334455, 0, 0.85, 0.25, g); box(0.08, 0.5, 0.08, 0x777777, 0, 0.25, 0, g); return g; }
function tvset() { const g = new THREE.Group(); box(1.8, 0.5, 0.5, 0x5a4030, 0, 0.25, 0, g); box(1.5, 0.85, 0.08, 0x111111, 0, 0.98, 0, g); box(1.38, 0.75, 0.02, mat(0x111122, 0x3a6aaa), 0, 0.98, 0.05, g); return g; }
function sofa() { const g = new THREE.Group(); box(2.2, 0.45, 0.9, 0xc0603a, 0, 0.25, 0, g); box(2.2, 0.55, 0.22, 0xa84f2e, 0, 0.7, -0.35, g); box(0.22, 0.35, 0.9, 0xa84f2e, -1.0, 0.6, 0, g); box(0.22, 0.35, 0.9, 0xa84f2e, 1.0, 0.6, 0, g); box(0.5, 0.15, 0.4, 0xf0e0a0, -0.5, 0.55, -0.1, g); return g; }
function kotatsu() { const g = new THREE.Group(); box(1.5, 0.35, 1.5, 0xc84a4a, 0, 0.18, 0, g); box(1.2, 0.06, 1.2, 0xc8a070, 0, 0.4, 0, g); mk(sphGeo, 0xf09030, 0.18, 0.18, 0.18, 0.2, 0.52, 0.1, g); mk(sphGeo, 0xf09030, 0.18, 0.18, 0.18, 0.35, 0.52, -0.05, g); mk(cylGeo, 0x2a6a4a, 0.25, 0.1, 0.25, -0.3, 0.48, 0, g); return g; }
function plant() { const g = new THREE.Group(); mk(cylGeo, 0xb06a40, 0.5, 0.5, 0.5, 0, 0.25, 0, g); mk(sphGeo, 0x3a9a4a, 0.9, 1.1, 0.9, 0, 1.0, 0, g); return g; }
function lamp() { const g = new THREE.Group(); mk(cylGeo, 0x444444, 0.06, 1.6, 0.06, 0, 0.8, 0, g); mk(cone8, mat(0xfff0c0, 0xaa9050), 0.6, 0.45, 0.6, 0, 1.7, 0, g); mk(cylGeo, 0x444444, 0.4, 0.05, 0.4, 0, 0.03, 0, g); return g; }
function nightstand() { const g = new THREE.Group(); box(0.6, 0.55, 0.5, 0x9b6b43, 0, 0.28, 0, g); mk(cylGeo, 0xe04040, 0.22, 0.2, 0.22, 0, 0.66, 0, g); mk(sphGeo, 0xe8e030, 0.08, 0.08, 0.08, -0.08, 0.8, 0, g); mk(sphGeo, 0xe8e030, 0.08, 0.08, 0.08, 0.08, 0.8, 0, g); return g; }
function cardboard() { const g = new THREE.Group(); box(0.8, 0.6, 0.6, 0xc8a060, 0, 0.3, 0, g); box(0.6, 0.5, 0.5, 0xb89050, 0.1, 0.85, 0, g); box(0.5, 0.4, 0.4, 0xd0aa70, -0.05, 1.3, 0.02, g); return g; }
// 街
function building(w, h, d) {
  const g = new THREE.Group(); const side = pick(bldMats);
  const m = new THREE.Mesh(bldGeo(w, h, d), [side, side, roofMat, roofMat, side, side]);
  m.position.y = h / 2; m.castShadow = m.receiveShadow = true; m.userData.unique = true; g.add(m);
  box(w + 0.2, 0.3, d + 0.2, 0x55555c, 0, h + 0.15, 0, g);
  if (Math.random() < 0.5) box(rand(0.8, 1.4), 0.8, rand(0.8, 1.4), 0x888890, rand(-w / 4, w / 4), h + 0.7, rand(-d / 4, d / 4), g);
  return g;
}
function house(w, d) {
  const g = new THREE.Group(); const h = rand(2.0, 2.8);
  box(w, h, d, pick([0xf0e6d0, 0xe8d0b0, 0xd0e0e8, 0xf0d8d8, 0xe0e8c8]), 0, h / 2, 0, g);
  const r = mk(cone4, pick([0x8a3a30, 0x3a4a7a, 0x4a6a4a, 0x5a4a40]), (Math.max(w, d) + 0.6) / 0.707, 1.6, (Math.max(w, d) + 0.6) / 0.707, 0, h + 0.8, 0, g); r.rotation.y = Math.PI / 4;
  box(0.7, 1.3, 0.05, 0x6a4a30, 0, 0.65, d / 2 + 0.03, g);
  box(0.7, 0.6, 0.05, mat(0x334455, 0x806a30), w / 4, h * 0.6, d / 2 + 0.03, g);
  return g;
}
function tree() { const g = new THREE.Group(); mk(cylGeo, 0x7a5030, 0.3, 1.6, 0.3, 0, 0.8, 0, g); if (Math.random() < 0.5) mk(sphGeo, pick([0x3a8a3a, 0x4a9a40, 0x2f7a4a]), 2.2, 2.0, 2.2, 0, 2.3, 0, g); else mk(cone8, pick([0x2f6a3a, 0x3a7a40]), 2.0, 3.0, 2.0, 0, 2.8, 0, g); return g; }
function car() {
  const g = new THREE.Group(); const c = pick([0xd03030, 0xf0f0f0, 0x2050c0, 0xf0c020, 0x303030, 0x40a080]);
  box(1.9, 0.7, 4.2, c, 0, 0.65, 0, g); box(1.7, 0.6, 2.2, c, 0, 1.3, -0.2, g); box(1.72, 0.45, 2.0, mat(0x223344, 0x101820), 0, 1.3, -0.2, g);
  for (const [x, z] of [[-0.9, -1.3], [0.9, -1.3], [-0.9, 1.3], [0.9, 1.3]]) { const w = mk(cylGeo, 0x181818, 0.7, 0.3, 0.7, x, 0.35, z, g); w.rotation.z = Math.PI / 2; }
  box(0.4, 0.15, 0.05, mat(0xffffe0, 0xffffa0), -0.6, 0.75, 2.11, g); box(0.4, 0.15, 0.05, mat(0xffffe0, 0xffffa0), 0.6, 0.75, 2.11, g);
  return g;
}
function pole() { const g = new THREE.Group(); mk(cylGeo, 0x9a9a92, 0.3, 7, 0.3, 0, 3.5, 0, g); box(1.6, 0.12, 0.12, 0x6a6a62, 0, 6.3, 0, g); mk(cylGeo, 0x707070, 0.4, 0.6, 0.4, 0.3, 5.5, 0, g); return g; }
function streetlamp() { const g = new THREE.Group(); mk(cylGeo, 0x505560, 0.15, 4, 0.15, 0, 2, 0, g); mk(sphGeo, mat(0xfff6c0, 0xffe080), 0.5, 0.5, 0.5, 0, 4.1, 0, g); return g; }
function vending() { const g = new THREE.Group(); box(1.0, 1.9, 0.75, pick([0xd02828, 0x2858c8, 0xf0f0f0]), 0, 0.95, 0, g); box(0.85, 0.9, 0.03, mat(0xe8f0ff, 0x8090a0), 0, 1.3, 0.38, g); for (let i = 0; i < 6; i++) box(0.1, 0.22, 0.04, pick([0xe04040, 0x40a0e0, 0xe0c040, 0x40c060]), -0.32 + i * 0.13, 1.35, 0.4, g); box(0.5, 0.15, 0.03, 0x222222, 0, 0.35, 0.38, g); return g; }

function buildWorld() {
  // 部屋の壁（2mごとのパネル）
  for (let i = 0; i < 8; i++) {
    const c = -ROOM + 1 + i * 2, col = i % 2 ? 0xeadfc8 : 0xe0d2b6;
    const mkWall = (x, z, ry) => { const g = new THREE.Group(); box(2, 2.6, 0.25, col, 0, 1.3, 0, g); box(2, 0.15, 0.28, 0x8a6a4a, 0, 0.08, 0, g); if (i === 3 || i === 5) box(1.1, 0.9, 0.27, mat(0x8ab0e0, 0x203050), 0, 1.6, 0, g); addD(g, x, z, ry, 50, '壁'); };
    mkWall(c, -ROOM, 0); mkWall(c, ROOM, 0); mkWall(-ROOM, c, Math.PI / 2); mkWall(ROOM, c, Math.PI / 2);
  }
  addD(wardrobe(), -6.6, -7.3, 0, 150, 'タンス');
  addD(bookshelf(), -3.9, -7.55, 0, 120, '本棚');
  addD(desk(), 3.6, -7.2, 0, 120, '机');
  addD(chair(), 3.6, -6.3, 0, 60, 'イス');
  addD(tvset(), 7.4, 1.0, -Math.PI / 2, 200, 'テレビ');
  addD(sofa(), -7.2, 1.8, Math.PI / 2, 150, 'ソファ');
  addD(kotatsu(), -3.8, 4.8, 0, 180, 'こたつ');
  addD(plant(), 7.1, -7.1, 0, 40, '観葉植物');
  addD(plant(), -7.1, 7.1, 0, 40, '観葉植物');
  addD(plant(), 7.1, 7.1, 0, 40, '観葉植物');
  addD(lamp(), -7.2, -4.2, 0, 60, 'ライト');

const debris = [];
const _v = new THREE.Vector3();
function spawnDebris(b, colors, dx, dz, power) {

      v: new THREE.Vector3(dx * sp + rand(-2.5, 2.5), rand(2, 8) + size.y * 0.15, dz * sp + rand(-2.5, 2.5)),
      w: new THREE.Vector3(rand(-8, 8), rand(-8, 8), rand(-8, 8)) });

function updateDebris(dt) {

    const p = debris[i]; p.life -= dt;
    p.v.y -= 22 * dt; p.m.position.addScaledVector(p.v, dt);
    const hy = p.m.scale.y / 2;
    if (p.m.position.y < hy) { p.m.position.y = hy; p.v.y *= -0.3; p.v.x *= 0.7; p.v.z *= 0.7; p.w.multiplyScalar(0.7); }
    p.m.rotation.x += p.w.x * dt; p.m.rotation.y += p.w.y * dt; p.m.rotation.z += p.w.z * dt;
    if (p.life < 0.6) p.m.scale.copy(p.base).multiplyScalar(Math.max(0.001, p.life / 0.6));

}

function localX(yaw) { return [Math.cos(yaw), -Math.sin(yaw)]; }

// 斥力：原点（部屋の中心）から離れる方向へ動きやすくする
const REPEL = 1.1;        // 外向きバイアスの強さ（0でランダムウォーク）
const ROLL_OUT = 0.8;     // 寝返りが外側を向く確率
function outward() {
  const r = Math.hypot(P.x, P.z);
  if (r < 0.3) { const a = rand(0, Math.PI * 2); return [Math.cos(a), Math.sin(a)]; }
  return [P.x / r, P.z / r];
}
// ランダム方向＋外向きベクトルの合成角
function biasedAngle() {
  const [ox, oz] = outward(), a = rand(0, Math.PI * 2);
  return Math.atan2(Math.sin(a) + oz * REPEL, Math.cos(a) + ox * REPEL);
}
function startAction() {
  P.t = 0; body.rotation.set(0, 0, 0); P.y = 0;
  if (P.grace > 0) { P.state = 'idle'; P.dur = P.grace; P.grace = 0; return; }
  const r = Math.random(), k = diffK();
  if (r < 0.3) {
    P.state = 'squirm'; P.dur = rand(1.0, 2.2);
    // その場でジタバタするだけ（移動しない）
    P.a = { vx: 0, vz: 0, yr: rand(-0.8, 0.8) };
  } else if (r < 0.38) {
    P.state = 'idle'; P.dur = rand(0.6, 1.4) / k;
  } else {
    const kind = r < 0.7 ? 'roll' : r < 0.9 ? 'flip' : 'spin';

    if (kind === 'roll') {
      const [lx, lz] = localX(P.yaw), [ox, oz] = outward(); const d = rand(0.7, 1.15) * k;
      const outSide = (lx * ox + lz * oz) >= 0 ? 1 : -1;
      side = Math.random() < ROLL_OUT ? outSide : -outSide;
      tx += lx * side * d; tz += lz * side * d;
    } else if (kind === 'flip') {
      const ang = biasedAngle(), d = rand(0.9, 1.6) * k;
      tx += Math.cos(ang) * d; tz += Math.sin(ang) * d; dyaw = rand(-1.6, 1.6);
    } else {

      tx += Math.cos(ang) * d; tz += Math.sin(ang) * d; dyaw = Math.PI * (Math.random() < 0.5 ? -1 : 1);
    }
    P.state = 'warn'; P.dur = warnTime();

function beginMove() {

    if (a.kind === 'roll') { body.rotation.z = -a.side * Math.PI * 2 * k; P.y = Math.sin(Math.PI * e) * 0.9; }

  }
}
// ワープ：寝ているベッドを中心に点対称の位置へ
let warpCool = 0;
const warpFx = [];
function warp() {
  if (warpCool > 0) return;
  const free = beds[1 - occupied], occ = beds[occupied];
  const ox = free.x, oz = free.z;
  free.x = clamp(occ.x * 2 - free.x, -48, 48);
  free.z = clamp(occ.z * 2 - free.z, -48, 48);
  // クランプで重なった場合の保険
  if (Math.abs(free.x - occ.x) < BW && Math.abs(free.z - occ.z) < BL) { free.x = ox; free.z = oz; return; }
  free.vx = -free.vx; free.vz = -free.vz;
  warpCool = 0.25;
  tone(900, 200, 0.18, 0.12, 'sawtooth'); tone(200, 1200, 0.22, 0.1, 'sine');
  for (const [x, z] of [[ox, oz], [free.x, free.z]]) {
    const m = new THREE.Mesh(new THREE.RingGeometry(0.6, 1.0, 40), new THREE.MeshBasicMaterial({ color: 0x9ae8ff, transparent: true, side: THREE.DoubleSide, depthWrite: false }));
    m.rotation.x = -Math.PI / 2; m.position.set(x, 0.1, z); scene.add(m); warpFx.push({ m, t: 0 });
  }
  const dx = free.x - occ.x, dz = free.z - occ.z, l = Math.hypot(dx, dz) || 1;
  smash(free, dx / l, dz / l, 4, false);
  free.g.position.set(free.x, 0, free.z);
}
function updateWarpFx(dt) {
  for (let i = warpFx.length - 1; i >= 0; i--) {
    const f = warpFx[i]; f.t += dt;
    f.m.scale.setScalar(1 + f.t * 6); f.m.material.opacity = 1 - f.t / 0.4;
    if (f.t > 0.4) { scene.remove(f.m); f.m.geometry.dispose(); f.m.material.dispose(); warpFx.splice(i, 1); }
  }
}
function updateBeds(dt) {
  const ix = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
  const iz = (keys.ArrowDown || keys.KeyS ? 1 : 0) - (keys.ArrowUp || keys.KeyW ? 1 : 0);
  const free = beds[1 - occupied], occ = beds[occupied];
  let tx = 0, tz = 0;
  if (state === 'play' && (ix || iz)) {
    if (selected === occupied) {
      if (markerShake <= 0) { selEl.classList.remove('shake'); void selEl.offsetWidth; selEl.classList.add('shake'); tone(180, 120, 0.12, 0.08, 'square'); }
      markerShake = 0.35;
    } else {
      const l = Math.hypot(ix, iz), SP = 6.5; tx = ix / l * SP; tz = iz / l * SP;
    }
  }
  const f = Math.min(1, dt * 11);
  free.vx += (tx - free.vx) * f; free.vz += (tz - free.vz) * f;
  // ベッド同士の押し合い。ぴったり接した状態を「重なり」と誤判定しないよう EPS の余裕を持たせる
  // （以前はここで計算誤差が出て、ベッドが横に1.6ぶん勝手に飛んでいた）
  const EPS = 0.002;
  const hitX = (x, z) => Math.abs(x - occ.x) < BW - EPS && Math.abs(z - occ.z) < BL - EPS;
  let nx = free.x + free.vx * dt;
  if (hitX(nx, free.z)) { nx = free.x < occ.x ? occ.x - BW : occ.x + BW; free.vx = 0; }
  free.x = clamp(nx, -48, 48);
  let nz = free.z + free.vz * dt;
  if (hitX(free.x, nz)) { nz = free.z < occ.z ? occ.z - BL : occ.z + BL; free.vz = 0; }
  free.z = clamp(nz, -48, 48);
  // 衝突破壊
  const sp = Math.hypot(free.vx, free.vz);
  if (sp > 0.3) smash(free, free.vx / sp, free.vz / sp, sp, true);
  warpCool -= dt;
  for (const b of beds) {
    b.g.position.set(b.x, 0, b.z);
    b.g.rotation.z = -b.vx * 0.012; b.g.rotation.x = b.vz * 0.012;
  }
  // マーカー
  markerShake -= dt;
  const sb = beds[selected], locked = selected === occupied;
  marker.material.color.setHex(locked ? 0xff5a6a : 0xffd84a);
  marker.position.set(sb.x + (markerShake > 0 ? Math.sin(T * 60) * 0.12 : 0), 2.3 + Math.sin(T * 5) * 0.15, sb.z);
  marker.visible = state === 'play';
  selEl.innerHTML = state === 'play'
    ? `操作中：<span style="color:${sb.css}">${sb.name}</span> ` + (locked ? '<span style="color:#ff5a6a">🔒 寝てるので動かせない（Enterで切替）</span>' : '<span style="color:#6cf0a0">✓ 動かせる</span>')
    : '';
  selEl.style.display = state === 'play' ? '' : 'none';
}

// ---------- カメラ ----------
let T = 0;
const camTarget = new THREE.Vector3(), camPos = new THREE.Vector3(0, 10, 9);
function updateCamera(dt) {
  const free = beds[1 - occupied];
  const dist = Math.hypot(free.x - P.x, free.z - P.z);
  const tx = P.x + (free.x - P.x) * 0.35, tz = P.z + (free.z - P.z) * 0.35;
  const k = 1 - Math.exp(-dt * 3);
  camTarget.x += (tx - camTarget.x) * k; camTarget.z += (tz - camTarget.z) * k; camTarget.y = 0.6;
  const zoom = clamp(dist - 2.5, 0, 25);
  const want = new THREE.Vector3(camTarget.x, 8.5 + zoom * 0.55, camTarget.z + 7.5 + zoom * 0.45);
  camPos.lerp(want, k);
  camera.position.copy(camPos);
  if (shake > 0) { camera.position.x += rand(-1, 1) * shake; camera.position.y += rand(-1, 1) * shake; shake = Math.max(0, shake - dt * 1.5); }
  camera.lookAt(camTarget);
  sun.position.set(camTarget.x + 12, 24, camTarget.z + 8); sun.target.position.copy(camTarget);
}

// ---------- 状態管理 ----------
let state = 'title';
const overlay = document.getElementById('overlay'), card = document.getElementById('card');
let best = 0; try { best = +localStorage.getItem('nezou_best') || 0; } catch (e) {}
const scoreNow = () => Math.floor(elapsed * 10) + destroyPts;

function showTitle() {
  card.innerHTML = `<h1>寝相バスター</h1>
  <p class="big">寝相が最悪な人を、ベッドを動かして守れ！</p>
  <p>ベッドは2つ。人が寝ていない方のベッドを動かして、<br>転がる先に先回りしよう。ベッドの外に出たら床に落ちてアウト。</p>
  <p><span style="color:#6cf0a0">●緑の輪</span>＝着地点はベッドの上 ／ <span style="color:#ff5a6a">●赤の輪</span>＝このままだと落ちる</p>
  <p><kbd>←↑↓→</kbd> ベッド移動　<kbd>Enter</kbd> 動かすベッドを切替<br><kbd>Space</kbd> 空いたベッドを寝てるベッドの反対側へワープ<br>家具・壁・街… ベッドで当てれば全部壊せる（スコア加算）</p>
  <div class="blink">Enter でスタート</div>`;
  overlay.style.display = 'flex';
}
function gameOver() {
  state = 'over';
  const s = scoreNow(); const nb = s > best; if (nb) { best = s; try { localStorage.setItem('nezou_best', String(best)); } catch (e) {} }
  card.innerHTML = `<h1>おはよう…</h1>
  <p class="big">床に落ちて目が覚めてしまった！</p>
  <p>スコア <b style="font-size:30px;color:#ffd84a">${s}</b> ${nb ? '<span style="color:#6cf0a0">NEW BEST!</span>' : ''}</p>
  <p>熟睡時間 ${elapsed.toFixed(1)}秒 ／ 破壊 ${kills}個 ／ ベスト ${best}</p>
  <div class="blink">Enter でもう一度</div>`;
  overlay.style.display = 'flex';
}
function startGame() {
  clearWorld(); buildWorld();
  for (const p of popups) p.el.remove(); popups.length = 0;
  beds[0].x = 0; beds[0].z = 0; beds[1].x = 1.7; beds[1].z = 0;
  for (const b of beds) b.vx = b.vz = 0;
  occupied = 0; selected = 1;
  Object.assign(P, { x: 0, z: 0.15, yaw: 0, y: 0, grace: 1.5 });
  body.rotation.set(0, 0, 0);
  elapsed = 0; kills = 0; destroyPts = 0; shake = 0;
  state = 'play'; overlay.style.display = 'none';
  startAction();
}

const scoreEl = document.getElementById('score'), timeEl = document.getElementById('time'), killsEl = document.getElementById('kills');
let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt;
  if (state === 'play') { elapsed += dt; updatePerson(dt); updateBeds(dt); }
  else if (state === 'falling') { updateFall(dt); updateBeds(dt); }
  else updateBeds(dt);
  if (state !== 'falling' && state !== 'over') animateLimbs(dt);
  else { person.position.set(P.x, TOP + 0.12 + P.y, P.z); person.rotation.y = P.yaw; }
  updateDebris(dt); updateWarpFx(dt); updateZ(dt); updatePopups(dt); updateCamera(dt);
  scoreEl.textContent = scoreNow(); timeEl.textContent = elapsed.toFixed(1); killsEl.textContent = kills;
  renderer.render(scene, camera);
}
buildWorld();
P.state = 'idle'; P.dur = 999;
showTitle();
requestAnimationFrame(loop);
</script>
