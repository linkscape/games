<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>県境オセロ</title>
<style>
:root{
  --bg:#0f2a1c; --panel:#143524; --ink:#eef5ef; --sub:#9db8a6; --line:#2a5a3e;
  --sea:#8fb3c4; --land:#b9c9a3; --border:#4d5a45; --coast:#5f9c78;
  --black:#111; --white:#f4f4f0; --hot:#ffd23f; --bad:#ff6b6b;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:"Hiragino Sans","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
button,select{font:inherit;color:inherit}
#app{display:flex;flex-direction:column;height:100%;height:100dvh}
header{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{font-size:18px;margin:0;letter-spacing:.12em;font-weight:900}
.sc{display:flex;align-items:center;gap:8px;padding:4px 10px;border-radius:10px;border:2px solid transparent;font-variant-numeric:tabular-nums;transition:border-color .2s,background .2s}
.sc.turn{border-color:var(--hot);background:rgba(255,210,63,.08)}
.sc .st{width:20px;height:20px;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.6)}
.sc .n{font-size:24px;font-weight:900;min-width:1.4em;text-align:right}
.sc .who{font-size:11px;color:var(--sub);line-height:1.2}
.scores{display:flex;gap:8px;margin-left:auto}
.btn{border:1px solid var(--line);background:#1a4430;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--coast)}
main{flex:1;position:relative;min-height:0;background:var(--sea);touch-action:none}
#map{width:100%;height:100%;display:block}
.pref{stroke:var(--border);stroke-width:1.2;vector-effect:non-scaling-stroke;stroke-linejoin:round;transition:fill .5s}
.borders{fill:none;stroke:var(--border);stroke-width:1.6;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.node .hole{fill:#2f7fe0;stroke:#fff;stroke-width:1.5;vector-effect:non-scaling-stroke}
.node .stone{stroke:#222;stroke-width:1.5;vector-effect:non-scaling-stroke;transition:fill .18s;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.5))}
.node .stone.b{fill:var(--black);stroke:#fff}
.node .stone.w{fill:var(--white)}
.node .legal{fill:none;stroke:#e8a400;stroke-width:3;vector-effect:non-scaling-stroke;opacity:0;pointer-events:none}
.node.can .legal{opacity:.9;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.35}}
.node .mark{fill:none;stroke:#e0002a;stroke-width:2.5;vector-effect:non-scaling-stroke;opacity:0;pointer-events:none}
.node.willflip .mark{opacity:1}
.node .hit{fill:transparent;cursor:pointer}
.node.last .stone{stroke:var(--hot);stroke-width:2.5}
.flip{animation:flip .35s ease}
@keyframes flip{0%{transform:scale(1)}50%{transform:scale(1.6,0.15)}100%{transform:scale(1)}}
.corr{stroke-linecap:round;fill:none;vector-effect:none;pointer-events:none}
.corr.prev{stroke:rgba(255,170,0,.28)}
.corr.fire{stroke:rgba(255,150,0,.6);animation:fire .8s forwards}
@keyframes fire{0%{opacity:1}100%{opacity:0}}
.corr.dead{stroke:rgba(255,255,255,.06)}
#tip{position:absolute;pointer-events:none;background:rgba(0,0,0,.75);padding:4px 8px;border-radius:6px;font-size:12px;white-space:nowrap;display:none}
#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);padding:8px 18px;border-radius:10px;background:rgba(0,0,0,.7);font-size:16px;font-weight:800;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
#zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}
#zoom .btn{width:38px;height:38px;padding:0;font-size:18px}
#pops{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pop{position:absolute;font-weight:900;color:var(--hot);text-shadow:0 2px 0 #000,0 0 14px rgba(255,210,63,.7);animation:pop 1s ease-out forwards;transform:translate(-50%,-50%);white-space:nowrap}
@keyframes pop{0%{opacity:0;scale:.5}15%{opacity:1;scale:1.2}30%{scale:1}100%{opacity:0;translate:0 -40px}}
.overlay{position:fixed;inset:0;background:rgba(3,12,7,.78);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.overlay[hidden]{display:none}
.menu{background:#123222;border:1px solid var(--line);border-radius:14px;padding:22px;max-width:470px;width:100%;max-height:100%;overflow:auto}
.menu h2{margin:0 0 4px;font-size:30px;font-weight:900;letter-spacing:.12em}
.menu p{font-size:13px;color:var(--sub);line-height:1.75;margin:6px 0 14px}
.menu p b{color:var(--ink)}
.row{display:flex;align-items:center;gap:10px;margin:10px 0;font-size:13px}
.row>span:first-child{width:5.5em;color:var(--sub)}
.seg{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.seg button{flex:1;padding:8px 6px;border-radius:8px;border:1px solid var(--line);background:#183f2b;cursor:pointer;font-weight:700;font-size:13px;white-space:nowrap}
.seg button.on{border-color:var(--hot);box-shadow:0 0 0 1px var(--hot) inset;background:#24533a}
.go{width:100%;margin-top:12px;padding:13px;border:0;border-radius:12px;background:var(--hot);color:#1d1600;font-size:17px;font-weight:900;cursor:pointer;letter-spacing:.1em}
.small{font-size:11px;color:var(--sub);margin-top:-4px;margin-left:6.2em}
.res{font-size:16px;line-height:2;margin:8px 0 6px}
.res b{font-size:28px}
@media (max-width:640px){h1{font-size:15px}.sc .n{font-size:19px}.sc{padding:3px 6px}.scores{margin-left:0}}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>県境オセロ</h1>
    <div class="scores">
      <div class="sc" id="scB"><div class="st" style="background:var(--black);border:1px solid #555"></div><div><div class="who" id="whoB">あなた</div><div class="who" id="prefB">0県</div></div><div class="n" id="nB">2</div></div>
      <div class="sc" id="scW"><div class="st" style="background:var(--white)"></div><div><div class="who" id="whoW">CPU</div><div class="who" id="prefW">0県</div></div><div class="n" id="nW">2</div></div>
    </div>
    <button class="btn" id="menuBtn">メニュー</button>
  </header>
  <main id="main">
    <svg id="map" xmlns="http://www.w3.org/2000/svg">
      <g id="gPref"></g><path id="gBorder" class="borders"/><g id="gCorr"></g><g id="gNodes"></g>
    </svg>
    <div id="pops"></div>
    <div id="tip"></div>
    <div id="toast"></div>
    <div id="zoom"><button class="btn" id="zIn">＋</button><button class="btn" id="zOut">－</button><button class="btn" id="zHome">⤢</button></div>
  </main>
</div>

<div class="overlay" id="startOv">
  <div class="menu">
    <h2>県境オセロ</h2>
    <p>マスは<b>県境どうし・県境と海岸線が交わる点</b>（全74点）。<br>
    石を置くと、置いた石から<b>自分の石すべてに向けて幅のある線</b>が伸び、その帯の中にある相手の石をひっくり返します。<br>
    1つもひっくり返せない点には置けません。交点は青丸、置ける点はさらに黄色い輪で光ります（マウスを乗せると、ひっくり返る石が赤く出ます）。<br>
    県の色は、その県に接する点で<b>石が多い方</b>に染まります（勝敗は石の数）。</p>
    <div class="row"><span>対戦</span><div class="seg" data-k="opp"><button data-v="cpu1">CPU弱</button><button data-v="cpu2" class="on">CPU普通</button><button data-v="cpu3">CPU強</button><button data-v="2p">2人</button></div></div>
    <div class="row"><span>手番</span><div class="seg" data-k="side"><button data-v="b" class="on">黒（先手）</button><button data-v="w">白（後手）</button></div></div>
    <div class="row"><span>線の幅</span><div class="seg" data-k="width"><button data-v="2.2">細い</button><button data-v="3.5" class="on">ふつう</button><button data-v="5.5">太い</button></div></div>
    <div class="row"><span>挟み方</span><div class="seg" data-k="rule"><button data-v="strict" class="on">オセロ式</button><button data-v="loose">ゆるい</button></div></div>
    <div class="small" id="ruleDesc"></div>
    <button class="go" id="goBtn">対局開始</button>
  </div>
</div>
<div class="overlay" id="endOv" hidden>
  <div class="menu" style="text-align:center">
    <h2 id="endTitle">勝ち</h2>
    <div class="res" id="endRes"></div>
    <div style="display:flex;gap:8px"><button class="go" id="againBtn">もう一局</button><button class="go" id="viewBtn" style="background:#24533a;color:var(--ink)">盤面を見る</button></div>
  </div>
</div>

  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),cx:(a.x+b.x)/2,cy:(a.y+b.y)/2};panLast=null}});
addEventListener("pointermove",e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2&&pinch){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y),cx=(a.x+b.x)/2,cy=(a.y+b.y)/2;panBy(cx-pinch.cx,cy-pinch.cy);zoomAt(cx,cy,d/pinch.d);pinch={d,cx,cy};moved+=99}
  else if(panLast){const dx=e.clientX-panLast.x,dy=e.clientY-panLast.y;moved+=Math.abs(dx)+Math.abs(dy);if(moved>6)panBy(dx,dy);panLast={x:e.clientX,y:e.clientY}}});
function endP(e){ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;if(!ptrs.size)panLast=null}
addEventListener("pointerup",endP);addEventListener("pointercancel",endP);
function panBy(dx,dy){const s=upp();vb.x-=dx*s;vb.y-=dy*s;applyVB()}

// ---------- nodes ----------
const nodeEls=[];
DATA.nodes.forEach((n,i)=>{
  const g=mk("g",{class:"node",transform:`translate(${n.x} ${n.y})`},$("gNodes"));
  const o={g,hole:mk("circle",{class:"hole"},g),legal:mk("circle",{class:"legal"},g),stone:mk("circle",{class:"stone",r:0},g),mark:mk("circle",{class:"mark"},g),hit:mk("circle",{class:"hit"},g)};
  o.hit.addEventListener("pointerenter",()=>hover(i));o.hit.addEventListener("pointerleave",()=>hover(-1));
  o.hit.addEventListener("click",()=>{if(moved>6)return;humanMove(i)});
  nodeEls.push(o);
});
function sizeStones(){const u=upp();
  nodeEls.forEach((o,i)=>{const r=Math.min(11*u,NN[i]*0.47);o.r=r;o.hole.setAttribute("r",r*0.6);o.legal.setAttribute("r",r*0.9);o.mark.setAttribute("r",r*1.15);o.hit.setAttribute("r",Math.max(r,Math.min(16*u,NN[i]*0.5)));
    if(board&&board[i])o.stone.setAttribute("r",r)})}

// ---------- rules ----------
let board=null,turn=1,W=3.5,STRICT=true,history=[],busy=false,over=false,lastMove=-1;
// 1=黒 2=白 0=空
// 点kが線分(i→j)の帯の中にあるか（端点は除く）
function inBand(i,j,k){const ax=NX[i],ay=NY[i],bx=NX[j]-ax,by=NY[j]-ay,L2=bx*bx+by*by;const px=NX[k]-ax,py=NY[k]-ay;
  const t=(px*bx+py*by)/L2;if(t<=0.0001||t>=0.9999)return false;const cx=px-t*bx,cy=py-t*by;return cx*cx+cy*cy<=W*W}
// 帯の中の点を前計算
let BAND=null;
function precompute(){BAND=[];for(let i=0;i<N;i++){BAND[i]=[];for(let j=0;j<N;j++){if(i===j){BAND[i][j]=[];continue}const a=[];for(let k=0;k<N;k++)if(k!==i&&k!==j&&inBand(i,j,k))a.push(k);BAND[i][j]=a}}}
function flipsFor(bd,i,p){
  if(bd[i])return null;const q=3-p;const set=new Set(),lines=[];
  for(let j=0;j<N;j++){if(bd[j]!==p)continue;const band=BAND[i][j];if(!band.length)continue;
    let ok=true,got=[];
    for(const k of band){if(bd[k]===q)got.push(k);else if(STRICT){ok=false;break}}
    if(ok&&got.length){got.forEach(k=>set.add(k));lines.push([j,got])}}
  return set.size?{flips:[...set],lines}:null;
}
function legalMoves(bd,p){const m=[];for(let i=0;i<N;i++){if(bd[i])continue;const f=flipsFor(bd,i,p);if(f)m.push({i,...f})}return m}
function count(bd){let b=0,w=0;for(const v of bd){if(v===1)b++;else if(v===2)w++}return [b,w]}
function prefOwners(bd){const own={};for(const k in prefEls){let b=0,w=0;DATA.nodes.forEach((n,i)=>{if(n.p.includes(k)){if(bd[i]===1)b++;else if(bd[i]===2)w++}});own[k]=b>w?1:w>b?2:0}return own}

// ---------- game flow ----------
const isCPU=p=>opt.opp!=="2p"&&p!==(opt.side==="b"?1:2);
function newGame(){
  W=+opt.width;STRICT=opt.rule==="strict";precompute();
  board=new Array(N).fill(0);over=false;busy=false;lastMove=-1;turn=1;
  // 中央付近の4点に交互配置
  const cx=DATA.nodes.reduce((s,n)=>s+n.x,0)/N,cy=DATA.nodes.reduce((s,n)=>s+n.y,0)/N;
  // 本州中部あたりを中心に
  const ccx=cx+ (DATA.nodes.find(n=>n.p.join()==="19,20,22")?.x-cx||0)*0.0;
  const near=DATA.nodes.map((n,i)=>({i,d:Math.hypot(n.x-cx,n.y-cy)})).sort((a,b)=>a.d-b.d).slice(0,4);
  const mx=near.reduce((s,a)=>s+NX[a.i],0)/4,my=near.reduce((s,a)=>s+NY[a.i],0)/4;
  near.sort((a,b)=>Math.atan2(NY[a.i]-my,NX[a.i]-mx)-Math.atan2(NY[b.i]-my,NX[b.i]-mx)).forEach((a,k)=>board[a.i]=k%2?2:1);
  $("whoB").textContent=opt.opp==="2p"?"黒":(opt.side==="b"?"あなた":"CPU");
  $("whoW").textContent=opt.opp==="2p"?"白":(opt.side==="w"?"あなた":"CPU");
  nodeEls.forEach(o=>{o.g.classList.remove("last","willflip","can");o.stone.style.display="";o.stone.setAttribute("r",0)});
  $("gCorr").innerHTML="";
  render();vb={...HOME};applyVB();
  // 最初の4石が見えるよう少しだけ寄せる…はしない（全体が盤）
  nextTurn(true);
}
function render(){
  nodeEls.forEach((o,i)=>{const v=board[i];if(v){o.stone.setAttribute("class","stone "+(v===1?"b":"w"));o.stone.setAttribute("r",o.r||3)}else{o.stone.setAttribute("r",0)}
    o.g.classList.toggle("last",i===lastMove)});
  const [b,w]=count(board);$("nB").textContent=b;$("nW").textContent=w;
  const own=prefOwners(board);let pb=0,pw=0;
  for(const k in prefEls){const v=own[k];prefEls[k].setAttribute("fill",v===1?"#7d8a6c":v===2?"#e6eedb":"var(--land)");if(v===1)pb++;if(v===2)pw++}
  $("prefB").textContent=pb+"県制圧";$("prefW").textContent=pw+"県制圧";
  $("scB").classList.toggle("turn",!over&&turn===1);$("scW").classList.toggle("turn",!over&&turn===2);
}
let legal=[];
function nextTurn(first){
  legal=legalMoves(board,turn);
  if(!legal.length){
    const other=legalMoves(board,3-turn);
    if(!other.length){return endGame()}
    toast(`${turn===1?"黒":"白"}は置ける点がない → パス`);turn=3-turn;legal=other;
  }
  render();
  nodeEls.forEach(o=>o.g.classList.remove("can"));
  if(isCPU(turn)){busy=true;setTimeout(cpuMove,650)}
  else{busy=false;legal.forEach(m=>nodeEls[m.i].g.classList.add("can"))}
}
function hover(i){
  $("gCorr").querySelectorAll(".prev").forEach(e=>e.remove());nodeEls.forEach(o=>o.g.classList.remove("willflip"));
  const tip=$("tip");
  if(i<0){tip.style.display="none";return}
  const n=DATA.nodes[i];const [sx,sy]=toScreen(n.x,n.y);
  tip.textContent=n.p.map(c=>PN[+c]).join("・");tip.style.display="block";tip.style.left=(sx+14)+"px";tip.style.top=(sy-30)+"px";
  if(busy||over||!board)return;const m=legal.find(m=>m.i===i);if(!m)return;
  m.lines.forEach(([j])=>drawBand(i,j,"prev"));m.flips.forEach(k=>nodeEls[k].g.classList.add("willflip"));
  tip.textContent+=`　→ ${m.flips.length}個返る`;
}
function drawBand(i,j,cls){return mk("line",{x1:NX[i],y1:NY[i],x2:NX[j],y2:NY[j],class:"corr "+cls,"stroke-width":W*2},$("gCorr"))}
function humanMove(i){if(busy||over||isCPU(turn))return;const m=legal.find(m=>m.i===i);if(!m){if(!board[i])toast("そこは挟めない");return}play(m)}
function play(m){
  busy=true;hover(-1);nodeEls.forEach(o=>o.g.classList.remove("can"));
  const p=turn;board[m.i]=p;lastMove=m.i;render();
  pachi();
  const o=nodeEls[m.i];o.stone.classList.remove("flip");void o.stone.getBBox();o.stone.classList.add("flip");
  // 帯を発射して、近い順にひっくり返す
  m.lines.forEach(([j])=>{const e=drawBand(m.i,j,"fire");setTimeout(()=>e.remove(),900)});
  const order=m.flips.slice().sort((a,b)=>Math.hypot(NX[a]-NX[m.i],NY[a]-NY[m.i])-Math.hypot(NX[b]-NX[m.i],NY[b]-NY[m.i]));
  order.forEach((k,idx)=>setTimeout(()=>{board[k]=p;const s=nodeEls[k].stone;s.classList.remove("flip");void s.getBBox();s.classList.add("flip");render();blip(330*Math.pow(2,Math.min(idx,14)/12*2),.09)},140+idx*70));
  const [sx,sy]=toScreen(NX[m.i],NY[m.i]);
  setTimeout(()=>{if(m.flips.length>=3)popText(m.flips.length>=8?`${m.flips.length}枚返し！！`:`${m.flips.length}枚返し`,sx,sy-20,m.flips.length>=8?30:22)},200);
  setTimeout(()=>{turn=3-p;nextTurn()},260+order.length*70);
}
// ---------- CPU ----------
function cpuMove(){
  if(over)return;const p=turn;let ms=legal.slice();let pick;
  if(opt.opp==="cpu1"){ms.sort(()=>Math.random()-.5);pick=ms[0]}
  else if(opt.opp==="cpu2"){ms.forEach(m=>m.sc=m.flips.length+Math.random()*1.5);ms.sort((a,b)=>b.sc-a.sc);pick=ms[0]}
  else{
    ms.forEach(m=>m.sc=m.flips.length);ms.sort((a,b)=>b.sc-a.sc);const cand=ms.slice(0,10);
    for(const m of cand){const bd=board.slice();bd[m.i]=p;m.flips.forEach(k=>bd[k]=p);
      const rep=legalMoves(bd,3-p);let worst=0;for(const r of rep)worst=Math.max(worst,r.flips.length);
      // 端の点（周りに点が少ない＝返されにくい）を少し好む
      m.sc=m.flips.length-0.9*worst-rep.length*0.15+(NN[m.i]>14?0.5:0)+Math.random()*.3}
    cand.sort((a,b)=>b.sc-a.sc);pick=cand[0]}
  play(pick);
}
function endGame(){
  over=true;busy=false;render();
  const [b,w]=count(board);const you=opt.side==="b"?1:2;
  let title;if(b===w)title="引き分け";else if(opt.opp==="2p")title=b>w?"黒の勝ち":"白の勝ち";else title=((b>w?1:2)===you)?"あなたの勝ち！":"CPUの勝ち";
  $("endTitle").textContent=title;
  const own=prefOwners(board);let pb=0,pw=0;for(const k in own){if(own[k]===1)pb++;if(own[k]===2)pw++}
  $("endRes").innerHTML=`黒 <b>${b}</b>　―　<b>${w}</b> 白<br><span style="font-size:13px;color:var(--sub)">制圧した県　黒 ${pb} ／ 白 ${pw}</span>`;
  if(((b>w?1:2)===you&&opt.opp!=="2p")||opt.opp==="2p")[0,4,7,12].forEach((s,i)=>blip(523*Math.pow(2,s/12),.2,i*.09));
  setTimeout(()=>$("endOv").hidden=false,500);
}
// ---------- fx ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}return AC}
function blip(f,d=.1,delay=0){const a=ac();if(!a)return;const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(.08,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}
function pachi(){const a=ac();if(!a)return;const len=a.sampleRate*.05,buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,6);const s=a.createBufferSource(),f=a.createBiquadFilter();f.type="bandpass";f.frequency.value=2200;s.buffer=buf;const g=a.createGain();g.gain.value=.6;s.connect(f);f.connect(g);g.connect(a.destination);s.start()}
let tT;function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(tT);tT=setTimeout(()=>t.classList.remove("show"),1600)}
function popText(t,x,y,size){const d=document.createElement("div");d.className="pop";d.textContent=t;d.style.left=x+"px";d.style.top=y+"px";d.style.fontSize=size+"px";$("pops").appendChild(d);setTimeout(()=>d.remove(),1000)}

// ---------- menus ----------
$("goBtn").onclick=()=>{ac();$("startOv").hidden=true;newGame()};
$("againBtn").onclick=()=>{$("endOv").hidden=true;$("startOv").hidden=false};
$("viewBtn").onclick=()=>{$("endOv").hidden=true};
$("menuBtn").onclick=()=>{$("startOv").hidden=false};
addEventListener("resize",applyVB);
applyVB();
</script>
